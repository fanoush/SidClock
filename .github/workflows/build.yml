name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pinned SDK
        uses: actions/cache@v4
        with:
          path: .sdk
          key: sidclock-sdk-${{ hashFiles('bootloader/fetch-sdk.sh') }}

      - name: Fetch pinned SDK
        run: bootloader/fetch-sdk.sh

      - name: Python build requirements
        run: python3 -m pip install --user -r tools/requirements-build.txt

      - name: Build bootloader
        run: bootloader/build.sh

      - name: Build application
        run: app/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sidclock-firmware
          path: |
            bootloader/build/zephyr/zephyr.hex
            bootloader/build/zephyr/zephyr.bin
            app/build/zephyr/zephyr.signed.bin

  release:
    # Pushing a v* tag builds and publishes a GitHub release with the
    # firmware assets and a SHA-256 checksum file.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # gh release needs a git context (it runs `git rev-parse` etc.), so
      # the repo must be checked out even though only artifacts are used.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sidclock-firmware

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp bootloader/build/zephyr/zephyr.hex "dist/sidclock-bootloader-${GITHUB_REF_NAME}.hex"
          cp bootloader/build/zephyr/zephyr.bin "dist/sidclock-bootloader-${GITHUB_REF_NAME}.bin"
          cp app/build/zephyr/zephyr.signed.bin "dist/sidclock-${GITHUB_REF_NAME}.signed.bin"
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -la dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # gh release create needs a token with Contents: write. If this
          # fails with "Resource not accessible by integration", enable
          # Settings -> Actions -> General -> Workflow permissions ->
          # "Read and write permissions" (or pass a PAT as GH_TOKEN).
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "SidClock ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*
          fi
