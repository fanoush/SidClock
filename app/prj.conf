# SidClock — Zephyr application configuration

# --- logging over SEGGER RTT (no UART on this board) ---
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
# The software BLE link layer does not allow immediate logging, and the RTT
# backend must not block. OVERWRITE (not DROP) keeps the *newest* lines in
# the up-buffer: when a line does not fit it discards the oldest unread
# bytes, where DROP would keep that stale text and throw every new line
# away. The buffer is read back over BLE by the `1E` debug command
# (tools/sidclock_ble.py log) - nothing else drains it.
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Keep DBG messages (e.g. one line per SPI transaction) out of the build so
# the RTT buffer is not flooded by display traffic.
CONFIG_LOG_MAX_LEVEL=3
# RTT buffer in the shared region at the start of RAM (.rtt_buff_data,
# CONFIG_SEGGER_RTT_SECTION_CUSTOM): MCUboot writes its boot decision into
# the same buffer before it starts the app, and the app keeps a valid
# control block instead of re-initialising one (CONFIG_SEGGER_RTT_INIT_MODE_
# STRONG_CHECK), so a reset's log starts with the bootloader's lines. The
# size must be identical in the app and in the bootloader: it decides where
# the control block sits (the up-buffer comes first), and a mismatch would
# put the two images' control blocks at different addresses. Debug builds
# use the same size (app/prj_debug.conf no longer changes it).
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

CONFIG_MAIN_STACK_SIZE=4096
# No dynamic allocation anywhere in the app: nothing in the image calls
# malloc()/k_malloc()/k_calloc()/operator new (verified in the linked ELF),
# so the 8 KB system heap was dead weight - keep it out of RAM.
# See docs/architecture.md ("RAM budget").
CONFIG_HEAP_MEM_POOL_SIZE=0

# --- thread stack diagnostics: per-thread high-water marks for the
# stack-overflow hunt + MPU guard pages turning a silent overflow into a
# diagnosable HardFault (watch RAM: ~860 B free). The 0x1D telemetry walks
# the thread list itself (see main.c), so the thread analyzer subsys is not
# needed - only the pieces it used to select.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_HW_STACK_PROTECTION=y

# --- hang safety net: independent watchdog (30 s, fed from the main loop)
# plus retained crash telemetry (see main.c). Any wedged thread stops the
# loop (directly or via a stuck lock) and reboots instead of freezing.
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

# --- display ---
CONFIG_DISPLAY=y

# --- buses ---
CONFIG_SPI=y
CONFIG_I2C=y

# --- external flash (OTA secondary slot) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
# The MX25R64 reports 64 KB blocks by default, but the slot (0x151000) is not
# a multiple of 64 KB. With 64 KB "pages" the progressive-erase trailer
# scramble erases past the end of the slot (FLASH_WRITE_FAILED) and slot
# erases can spill into the LittleFS partition. 4 KB matches the hardware
# sector size and the bootloader build.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# --- accelerometer ---
CONFIG_SENSOR=y
CONFIG_LIS2DH=y

# --- battery monitor (nRF SAADC, AIN7) ---
CONFIG_ADC=y

# --- speaker: I2S to the amplifier (AW88082 pinout in app.overlay) ---
CONFIG_I2S=y

# --- power management ---
# The nRF54L15 port of this Zephyr tree does not implement the system PM
# subsystem (no HAS_PM), so CONFIG_PM / CONSTLAT idle states are not
# available. The kernel still runs WFI in its idle thread and uses a
# tickless clock (TICKLESS_CAPABLE default).
CONFIG_TICKLESS_KERNEL=y

# --- Bluetooth + MCUmgr (BLE OTA) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SidClock"
# No mbedTLS in this minimal setup; host crypto is not needed for
# advertising + unpaired MCUmgr/SMP. bt_rand() is provided by the app
# through the controller (see main.c).
CONFIG_BT_HOST_CRYPTO=n
CONFIG_BT_SMP=n
# PSA crypto RNG driver would need mbedTLS; the split LL gets entropy
# through CONFIG_ENTROPY_BT_HCI instead.
CONFIG_ENTROPY_PSA_CRYPTO_RNG=n
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# OTA throughput: the split link layer defaults (27-byte data length,
# 1 RX buffer) cripple uploads; DLE + more buffers fix the throughput.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_RX_BUFFERS=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
# Runtime (un)registration of the mcumgr SMP service - the UI's BLE R/O
# and BLE OFF modes drop OTA/file/os-mgmt over BLE.
CONFIG_BT_GATT_DYNAMIC_DB=y

CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# Report the local SMP buffer size via the "MCUmgr parameters" command.
# Without it, smpmgr falls back to the ATT MTU (247 B) for packet sizing and
# each round trip only carries ~220 B of image data.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
# Accept SMP packets split across multiple GATT writes (needed for >247 B
# packets while the ATT MTU stays 247).
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
# zcbor CBOR library (dependency of MCUmgr; the module is in ZEPHYR_MODULES)
CONFIG_ZCBOR=y

CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
# Erase the secondary slot page-by-page while receiving, instead of erasing
# the whole slot (985 KB, 10+ s) inside the first upload request.
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_REBOOT=y

# Chain-loaded by MCUboot: link the app at code-partition + 0x800 header,
# matching the bootloader's image layout (0x800 header before the vectors).
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_ROM_START_OFFSET=0x800

# No UART on this board - the DK console UART (uart20) claims the I2S
# amplifier pins (P1.04/P1.06). Logging goes over SEGGER RTT.
CONFIG_SERIAL=n

# LittleFS on the external MX25R64 ("storage" partition), served over BLE
# by MCUmgr fs_mgmt (smpmgr file ...) for uploading tunes and settings.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
CONFIG_FLASH_MAP=y
# LittleFS metadata walks were the hidden cost behind the listing stutter:
# a 64-byte cache made /home scans a burst of tiny SPI reads (~0.5 s for
# ~90 files). 256 bytes cuts that ~4x (and uploads program 256-byte
# chunks instead of 16) for ~1.1 KB of RAM; the listing itself no longer
# scans at all (see the home_list_cache in main.c).
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
# File-access hooks: fs_mgmt uploads append their name to the listing
# cache, so refreshing the library after an upload needs no directory
# scan (which starved the audio refill thread).
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y

# C++ (vendored cSID-light SID emulator)
CONFIG_CPP=y

# Hardware FPU: the SID emulator's hot paths are single-precision float
# (6510 cycle accounting, SID filter). With soft-float a 512-sample render
# took ~30 ms - over the 23 ms EasyDMA buffer period - so the DMA starved
# and kept replaying buffers (audible as a slow, stuttering tune).
CONFIG_FPU=y

# Crash resilience while bringing up the SID player. The debug GATT
# callbacks run on the BT RX workqueue: the /home listing page and file
# delete walk LittleFS there, they alone use ~800 B on top of the host's
# own frames, and 2048 B once overflowed under a web session (the
# listing now serves pages from RAM, see main.c). 2560 leaves ~1.7 KB
# free after a delete.
CONFIG_BT_RX_STACK_SIZE=2560
