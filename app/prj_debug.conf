# SidClock - debug build fragment (SIDCLOCK_DEBUG=1 ./build.sh)
#
# This fragment is only applied for debug builds; the default build is the
# slimmer release configuration (see prj.conf). It is the place for options
# that cost RAM and are only useful while bringing something up or chasing a
# bug on the bench:
#
#   * SIDCLOCK_DEBUG switches on the bring-up test commands in the firmware
#     (test tones, rate/tone ladders, raw MCKFREQ - see audio.c and main.c),
#     which the release builds compile out.
#
# The SEGGER RTT log buffer size is *not* changed here: it lives in the
# shared RAM region both the bootloader and the app use, and the control
# block's address depends on it, so release and debug must keep the same
# value (see the comment in prj.conf).
#
# Debug images show "-dbg" in the on-display version string; the signed image
# version stays the same, so OTA still compares like-for-like.
