# SidClock - debug build fragment (SIDCLOCK_DEBUG=1 ./build.sh)
#
# This fragment is only applied for debug builds; the default build is the
# slimmer release configuration (see prj.conf). It is the place for options
# that cost RAM and are only useful while bringing something up or chasing a
# bug on the bench:
#
#   * full 8 KB SEGGER RTT log buffer (release: 2 KB), so more of the newest
#     LOG_* lines stay available to the `log` BLE drain,
#   * SIDCLOCK_DEBUG also switches on the bring-up test commands in the
#     firmware (test tones, rate/tone ladders, raw MCKFREQ - see audio.c and
#     main.c), which the release builds compile out.
#
# Debug images show "-dbg" in the on-display version string; the signed image
# version stays the same, so OTA still compares like-for-like.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
