# MCUboot configuration for SidClock on the Saphe T device (nRF54L15).
#
# Signature: the stock bootloader's signing keys are not available, so this
# build validates images by SHA-256 hash only (MCUboot no-signature mode).
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Secondary slot lives on the external MX25R64 (SPI NOR) over SPIM00.
# The Zephyr SPI/NOR drivers need the kernel's multithreading support
# (MCUboot defaults to a single-threaded build on some boards).
CONFIG_MULTITHREADING=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
# Report the flash's real erase geometry (4 KiB pages). With the default
# 64 KiB layout page the external slot appears as 22 sectors while the
# internal slot has 337, and MCUboot refuses to swap
# ("Cannot upgrade: not a compatible amount of sectors").
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# 337 x 4 KiB sectors per slot.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=512

# No serial console in the bootloader either.
#
# Built for the nrf54l15dk target, MCUboot inherits the DK's console UART
# (uart20 on P1.04 TX / P1.05 RX / P1.06 RTS / P1.07 CTS) - exactly the I2S
# amplifier pins. UARTE20 then stays enabled into the application, holding
# P1.06 (SDOUT) low, which silences the amplifier while every I2S register
# looks perfect. The board has no UART wired; bootloader logs go over SEGGER
# RTT instead (below).
CONFIG_SERIAL=n
CONFIG_CONSOLE=n

# Log over SEGGER RTT into the same RAM region the app uses (.rtt_buff_data
# at the start of RAM, CONFIG_SEGGER_RTT_SECTION_CUSTOM): MCUboot writes its
# boot decision into the buffer the app's `log` BLE drain reads, so a reset's
# log starts with the bootloader's lines and an OTA swap can be diagnosed
# without a probe attached. The app keeps a valid control block instead of
# re-initialising one (CONFIG_SEGGER_RTT_INIT_MODE_STRONG_CHECK), which is
# what makes the buffers one. OVERWRITE keeps the newest lines (including
# the bootloader's) when the buffer is full.
#
# The up-buffer size decides where the control block sits inside the region,
# so it must be *identical* in both images (app/prj.conf).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
# Keep the per-transaction SPI debug out of the log: during a swap it floods
# the RTT buffer and slows the flash operations down enormously.
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_FLASH_LOG_LEVEL_WRN=y
