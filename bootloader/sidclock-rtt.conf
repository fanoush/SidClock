# Verbose bootloader logging: same shared RTT buffer as the default build,
# with MCUboot's debug-level messages (validation, swap decisions, flash
# errors).
#
#   ./build.sh rtt
#
# The RTT section, its size and the backend come from
# sidclock-mcuboot.conf; a different buffer size would move the control
# block and break the sharing with the app, so only the log level changes
# here.
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
