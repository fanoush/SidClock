# Debug variant: SEGGER RTT logging for the bootloader.
#
# Flashed with this config, MCUboot creates an RTT control block and prints
# its full boot decision (image validation, swap type, flash errors) over
# channel 0. Build it with:
#
#   ./build.sh rtt
#
# Not blocking: if no RTT host is attached, messages are dropped instead of
# hanging the bootloader.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
# Keep the per-transaction SPI debug out of the log: during a swap it floods
# the RTT buffer and slows the flash operations down enormously.
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_FLASH_LOG_LEVEL_WRN=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
