<title>SidClock web remote connection test</title>
<style>
  body {
    font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace;
    margin: 20px;
    background: #101820;
    color: #d0d8e0;

  pre { white-space: pre-wrap; }
  iframe {
    float: right;

    background: #fff;
  }
</style>

<body>
<!--
  Page-level connection test: loads the real web remote (web/index.html)
  with a fake Web Bluetooth device. The fake link can fail the first
  state read, the CCC write or an info read, which is what a fresh
  Android connection does - the page must stay connected and usable.

  In a browser, over http (module imports need a real origin):

    python3 -m http.server 8899        # from the repository root
    # then open http://127.0.0.1:8899/tools/web-tests/connect.html

  Automatically, with a headless Chrome:

    python3 tools/web-tests/record.py --out /tmp/connect.txt &
    google-chrome --headless=new --disable-gpu \
        "http://127.0.0.1:8901/tools/web-tests/connect.html?record"
-->
<pre id="out">running…</pre>
<div id="frame"></div>
<script type="module" src="connect.js"></script>
</body>
</html>
