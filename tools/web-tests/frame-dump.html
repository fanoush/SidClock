<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>smp frame dump</title>
</head>
<body>
<!--
  Bring-up helper (not part of the test suite): prints the exact SMP
  request frames web/smp.js sends for a 2500-byte upload plus a download
  and a status request, as "<length> <hex>" ATT pieces, so they can be
  replayed against a real device over BLE and the replies checked.

    chrome --headless=new --disable-gpu --dump-dom \
      --virtual-time-budget=5000 \
      "http://127.0.0.1:8899/tools/web-tests/frame-dump.html"
    # -> parse <pre id="out">, concatenate the hex pieces, then write each
    #    SMP frame to da2e7828-fbce-4e01-ae9e-261174997c48 in <=244-byte
    #    ATT writes (no response) with notifications subscribed; the
    #    second chunk is cbor2.dumps({'off','data','name'}, canonical=True)
    #    in a 0x0A/group 8/command 0 frame
-->
<pre id="out">running…</pre>
<script type="module">
import { SmpClient } from '../../web/smp.js';

const NAME = '/home/js_probe.sid';
const data = new Uint8Array(2500);
for (let i = 0; i < data.length; i++) data[i] = (i * 31 + 7) & 0xff;

class Capture {
  constructor() {
    this.frames = [];
    this.properties = { writeWithoutResponse: true };
  }
  addEventListener() {}
  removeEventListener() {}
  async startNotifications() {}
  async stopNotifications() {}
  async writeValueWithoutResponse(bytes) {
    this.frames.push(bytes.slice());
  }
}

const cap = new Capture();
const cli = new SmpClient(cap, { timeoutMs: 5, retries: 0 });
cli.bufSize = 2048; // what the device reports (its mcumgr netbuf size)

try { await cli.uploadFile(NAME, data); } catch (e) { /* no peer */ }
try { await cli.downloadFile(NAME); } catch (e) { /* no peer */ }
try { await cli.status(NAME); } catch (e) { /* no peer */ }

const hex = (b) =>
  [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
document.getElementById('out').textContent =
  cap.frames.map((f) => `${f.length} ${hex(f)}`).join('\n');
</script>
</body>
</html>
