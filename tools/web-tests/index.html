<!--
  Browser tests for the web remote's libraries (md5, SMP, HVSC parsing).

  In a browser, over http (module imports need a real origin):

    python3 -m http.server 8899        # from the repository root
    # then open http://127.0.0.1:8899/tools/web-tests/index.html
    # add ?live for the hvsc.c64.org checks (network, ~9 MB of database
    # downloads, cached in IndexedDB)

  Automatically, with a headless Chrome:

    python3 tools/web-tests/record.py --out /tmp/web-tests.txt &
    google-chrome --headless=new --disable-gpu \\
        "http://127.0.0.1:8901/tools/web-tests/index.html?record&live"
-->
<pre id="out">running…</pre>
<script type="module" src="tests.js"></script>
</body>
</html>
